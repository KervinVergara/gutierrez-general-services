name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Component tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rules-tests:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run test:rules

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # tests/e2e/smoke.spec.js deliberately never submits the quote form or
    # signs in to /admin (so it never writes a fake lead to the real
    # Firestore project) — it only checks static/client-side behavior
    # (page loads, language switch, native form validation, legal pages,
    # 404). None of that needs a real Firebase project, so this runs with
    # no Firebase config at all (the app just runs in its "not configured"
    # state, same as any fresh checkout without a .env file).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
